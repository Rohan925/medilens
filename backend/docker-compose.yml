version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: medilens_db
    restart: always
    environment:
      POSTGRES_USER: medilens
      POSTGRES_PASSWORD: medilens123
      POSTGRES_DB: medilens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: